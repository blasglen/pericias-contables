<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Pericias Contables</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#243329">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pericias">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#182620; --paper:#EFEAE0; --paper-2:#E6E0D2;
    --folder:#3B5240; --folder-dark:#243329;
    --brass:#A67C3D; --brass-dark:#8A6530;
    --alert:#9B3B3B; --warn:#C08A2E; --ok:#4B7455; --teal:#3F6470; --slate:#7A7A6E;
    --line:#C9C0AC; --white-ish:#FBF9F4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Source Serif 4',Georgia,serif;-webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono','Courier New',monospace;}
  #app{max-width:1100px;margin:0 auto;padding:28px 24px 80px;}

  .masthead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px double var(--folder-dark);padding-bottom:16px;margin-bottom:14px;gap:16px;flex-wrap:wrap;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;color:var(--folder-dark);text-transform:uppercase;margin-bottom:4px;}
  .masthead h1{margin:0;font-size:30px;font-weight:700;color:var(--folder-dark);}
  .masthead-actions{display:flex;gap:8px;}
  .btn{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.03em;border:none;border-radius:3px;padding:11px 18px;cursor:pointer;transition:transform .12s ease;}
  .btn:hover{transform:translateY(-1px);}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  .btn-brass{background:var(--brass);color:var(--white-ish);}
  .btn-brass:hover{background:var(--brass-dark);}
  .btn-ghost{background:transparent;color:var(--folder-dark);border:1px solid var(--line);}
  .btn-alert{background:var(--alert);color:var(--white-ish);}
  .btn-small{padding:6px 12px;font-size:11px;}

  .conn-bar{
    display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;
    padding:8px 12px;border-radius:3px;margin-bottom:20px;
  }
  .conn-ok{background:#e4ede4;color:var(--folder-dark);border:1px solid #c3d5c4;}
  .conn-warn{background:#f4e6d7;color:var(--warn);border:1px solid #e6cfa9;}
  .conn-error{background:#f2dede;color:var(--alert);border:1px solid #e3bcbc;}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0;}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px;}
  .stat-card{background:var(--white-ish);border:1px solid var(--line);border-radius:4px;padding:14px 16px;}
  .stat-num{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;color:var(--folder-dark);}
  .stat-label{font-size:11px;font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;color:var(--slate);text-transform:uppercase;margin-top:2px;}
  .stat-card.alert-stat .stat-num{color:var(--alert);}
  .stat-card.warn-stat .stat-num{color:var(--warn);}

  .controls{display:flex;gap:10px;margin-bottom:26px;flex-wrap:wrap;}
  .controls input,.controls select{font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:9px 10px;border:1px solid var(--line);border-radius:3px;background:var(--white-ish);color:var(--ink);}
  #search{flex:1;min-width:220px;}
  .controls select{cursor:pointer;}

  #list{display:flex;flex-direction:column;gap:26px;}
  .empty{text-align:center;padding:60px 20px;color:var(--slate);font-style:italic;}

  .ficha{position:relative;background:var(--white-ish);border:1px solid var(--line);border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.04);}
  .ficha::before{content:attr(data-tab-label);position:absolute;top:-15px;left:18px;background:var(--tab-color,var(--slate));color:var(--white-ish);font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;padding:3px 10px 4px;border-radius:3px 3px 0 0;text-transform:uppercase;}
  .stamp{position:absolute;top:12px;right:18px;width:78px;height:78px;border-radius:50%;border:2px dashed var(--folder-dark);display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(-9deg);color:var(--folder-dark);font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.05em;opacity:.75;pointer-events:none;}

  .ficha-header{display:grid;grid-template-columns:150px 1fr 160px 150px 120px;align-items:center;gap:14px;padding:22px 20px 16px;cursor:pointer;}
  .expediente{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--folder-dark);font-weight:600;}
  .caratula{font-size:16px;line-height:1.3;}
  .caratula .juzgado-mini{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--slate);margin-top:3px;}
  .caratula .ultimo-acontecimiento{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--folder-dark);margin-top:6px;line-height:1.4;}
  .caratula .ultimo-acontecimiento .ultimo-fecha{color:var(--brass-dark);font-weight:600;}
  .badge-contador{font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--paper-2);padding:5px 9px;border-radius:3px;text-align:center;color:var(--folder-dark);}
  .estado-pill{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-align:center;padding:6px 8px;border-radius:12px;color:var(--white-ish);}
  .vencimiento{font-family:'IBM Plex Mono',monospace;font-size:12px;text-align:right;}
  .vencimiento .lbl{display:block;font-size:9px;color:var(--slate);letter-spacing:.05em;}
  .venc-ok{color:var(--ok);} .venc-warn{color:var(--warn);font-weight:600;} .venc-alert{color:var(--alert);font-weight:700;}

  .ficha-body{border-top:1px solid var(--line);padding:18px 20px 22px;display:none;}
  .ficha-body.open{display:block;}
  .ficha-actions{display:flex;gap:8px;margin-bottom:18px;}
  .timeline-title{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--folder-dark);margin:0 0 10px;}
  .timeline{list-style:none;margin:0 0 16px;padding:0;border-left:2px solid var(--line);}
  .timeline li{position:relative;padding:2px 0 14px 20px;}
  .timeline li::before{content:'';position:absolute;left:-7px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--brass);border:2px solid var(--white-ish);}
  .timeline .nov-fecha{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--slate);}
  .timeline .nov-texto{font-size:14.5px;margin-top:2px;}
  .no-novedades{color:var(--slate);font-style:italic;font-size:13px;margin-bottom:16px;}

  .add-novedad{display:flex;gap:8px;align-items:flex-start;}
  .add-novedad input[type=date]{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px;border:1px solid var(--line);border-radius:3px;}
  .add-novedad textarea{flex:1;font-family:'Source Serif 4',serif;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:3px;resize:vertical;min-height:38px;}

  #modal-overlay{position:fixed;inset:0;background:rgba(24,38,32,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .hidden{display:none !important;}
  #modal-overlay.hidden{display:none;}
  .modal-box{background:var(--white-ish);border-radius:5px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:26px 28px 22px;box-shadow:0 12px 40px rgba(0,0,0,.25);}
  .modal-box h2{margin:0 0 8px;font-size:20px;color:var(--folder-dark);}
  .modal-box p.hint{margin:0 0 18px;font-size:13px;color:var(--slate);line-height:1.5;}

  #config-overlay{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  #config-overlay.hidden{display:none;}
  .login-box{max-width:420px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.12);}
  .login-box .eyebrow{text-align:center;}
  .login-box h2{font-size:26px;}
  .login-box .field{text-align:left;}
  .login-conn{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--slate);margin-top:14px;min-height:16px;}

  /* Vista de detalle */
  .ficha-madre{position:relative;background:var(--white-ish);border:1px solid var(--line);border-radius:2px;padding:22px 20px;margin-bottom:8px;}
  @keyframes resaltarBloque{
    0%{box-shadow:0 0 0 3px var(--brass);}
    70%{box-shadow:0 0 0 3px var(--brass);}
    100%{box-shadow:0 0 0 0 transparent;}
  }
  .resaltado{animation:resaltarBloque 2.2s ease-out;}
  .ficha-madre::before{content:attr(data-tab-label);position:absolute;top:-15px;left:18px;background:var(--folder-dark);color:var(--white-ish);font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;padding:3px 10px 4px;border-radius:3px 3px 0 0;}
  .ficha-madre.ficha-documento::before{background:var(--brass);}
  .ficha-madre h2{margin:0 0 4px;font-size:20px;color:var(--folder-dark);}
  .ficha-madre .juzgado-line{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--slate);margin-bottom:14px;}
  .ficha-madre-grid{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:14px;}
  .ficha-madre-grid > div{font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .ficha-madre-grid .lbl{display:block;font-size:9.5px;color:var(--slate);letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px;}
  .ficha-madre .resumen{font-size:14.5px;line-height:1.55;border-top:1px solid var(--line);padding-top:14px;margin-top:4px;}
  #detail-documentos{display:flex;flex-direction:column;gap:26px;margin-top:26px;}
  .ficha-documento .doc-actions{position:absolute;top:12px;right:18px;display:flex;gap:8px;}

  /* Vista pericial contable */
  .pericial-bloque{background:var(--white-ish);border:1px solid var(--line);border-radius:4px;padding:20px 22px;margin-bottom:22px;}
  .pericial-bloque h3{margin:0 0 14px;font-size:16px;color:var(--folder-dark);font-family:'IBM Plex Mono',monospace;letter-spacing:.03em;}
  .pericial-bloque h3 .fuente{color:var(--brass);}
  .puntos-list{list-style:decimal;margin:0;padding-left:22px;counter-reset:none;}
  .puntos-list li{padding:10px 0 16px 4px;font-size:14.5px;line-height:1.5;border-bottom:1px solid var(--paper-2);}
  .puntos-list li:last-child{border-bottom:none;}
  .puntos-list li::marker{color:var(--brass);font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .pericial-parte{border-left:2px solid var(--brass);padding-left:14px;margin-bottom:16px;}
  .pericial-parte:last-child{margin-bottom:0;}
  .pericial-parte-nombre{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--brass-dark);margin-bottom:6px;font-weight:600;}
  .puntos-acciones{display:flex;gap:8px;margin:-4px 0 14px;flex-wrap:wrap;}
  .punto-texto{margin-bottom:8px;}
  .respuesta-label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--slate);margin-bottom:4px;}
  .respuesta-ia{width:100%;box-sizing:border-box;padding:8px 9px;border:1px solid var(--line);border-radius:3px;font-family:'Source Serif 4',serif;font-size:13.5px;background:var(--paper);resize:vertical;min-height:48px;}
  .pericial-sin{font-size:14px;color:var(--slate);font-style:italic;}
  .liq-table{width:100%;border-collapse:collapse;font-size:14px;}
  .liq-table td{padding:8px 4px;border-bottom:1px solid var(--paper-2);}
  .liq-table td:last-child{text-align:right;font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
  .liq-table tr.total td{border-top:2px solid var(--folder-dark);border-bottom:none;font-weight:700;padding-top:10px;}
  .liq-table td.clickable{cursor:pointer;}
  .liq-table tr.clickable-row:hover td{background:var(--paper-2);}
  .calculo-item{background:var(--white-ish);border:1px solid var(--line);border-radius:4px;padding:16px 18px;margin-bottom:14px;}
  .calculo-item .rubro{font-weight:bold;font-size:15px;color:var(--folder-dark);display:flex;justify-content:space-between;gap:12px;}
  .calculo-item .monto{font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
  .calculo-item .detalle{margin-top:8px;font-size:14px;line-height:1.5;color:var(--ink);}
  .calculo-item .sin-detalle{margin-top:8px;font-size:13px;color:var(--slate);font-style:italic;}
  .pericial-empty{color:var(--slate);font-style:italic;font-size:14px;}
  .archivo-chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:4px 6px 4px 12px;margin:0 6px 6px 0;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--folder-dark);}
  .archivo-chip .archivo-tam{color:var(--slate);}
  .archivo-chip button{background:var(--white-ish);border:1px solid var(--line);border-radius:50%;width:18px;height:18px;line-height:1;cursor:pointer;color:var(--alert);font-size:12px;padding:0;}
  .archivo-chip button:hover{background:var(--alert);color:var(--white-ish);}
  .archivos-resumen{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--slate);margin-bottom:6px;}
  .archivos-resumen.archivos-alerta{color:var(--alert);}
  .archivos-resumen.archivos-warn{color:var(--brass-dark);}
  .btn-vaciar-archivos{background:none;border:none;color:var(--slate);text-decoration:underline;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:11px;margin-left:8px;}
  .ficha-madre-actions{display:flex;gap:8px;margin-top:16px;}

  .doc-toggle{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:var(--brass);color:var(--white-ish);border:2px solid var(--white-ish);cursor:pointer;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.22);z-index:2;transition:background .12s ease,transform .12s ease;}
  .doc-toggle:hover{background:var(--brass-dark);transform:translateY(-50%) scale(1.06);}
  .doc-toggle-right{right:-16px;}
  .doc-toggle-left{left:-16px;}
  .contestacion-tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass-dark);background:var(--paper-2);padding:3px 8px;border-radius:3px;margin-bottom:10px;}
  @media (max-width:800px){
    .doc-toggle-right{right:-12px;width:32px;height:32px;font-size:15px;}
    .doc-toggle-left{left:-12px;width:32px;height:32px;font-size:15px;}
  }

  .nov-card{position:relative;background:var(--white-ish);border:1px solid var(--line);border-radius:2px;padding:18px 20px;margin-bottom:22px;}
  .nov-card::before{content:attr(data-tab-label);position:absolute;top:-14px;left:18px;background:var(--tab-color,var(--brass));color:var(--white-ish);font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;padding:3px 10px 4px;border-radius:3px 3px 0 0;}
  .nov-card .nov-texto{font-size:15px;line-height:1.5;}
  .nov-card .nov-del{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--slate);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:11px;}
  .nov-card .nov-del:hover{color:var(--alert);}
  .nov-tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:10px;margin-bottom:8px;}
  .nov-tag-personal{background:#e2ebec;color:var(--teal);}
  .nov-tag-expediente{background:var(--paper-2);color:var(--brass-dark);}

  .nov-filter{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .nov-filter-btn{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.04em;background:transparent;border:1px solid var(--line);color:var(--slate);padding:6px 12px;border-radius:14px;cursor:pointer;transition:all .12s ease;}
  .nov-filter-btn:hover{border-color:var(--brass);color:var(--folder-dark);}
  .nov-filter-btn.active{background:var(--folder-dark);border-color:var(--folder-dark);color:var(--white-ish);}

  .nov-origen-toggle{display:flex;gap:6px;margin-bottom:8px;}
  .nov-origen-btn{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.03em;background:var(--paper);border:1px solid var(--line);color:var(--slate);padding:6px 10px;border-radius:3px;cursor:pointer;}
  .nov-origen-btn.active[data-origen="personal"]{background:#e2ebec;border-color:var(--teal);color:var(--teal);}
  .nov-origen-btn.active[data-origen="expediente"]{background:var(--paper-2);border-color:var(--brass);color:var(--brass-dark);}
  .ai-box{background:var(--paper-2);border:1px dashed var(--brass);border-radius:4px;padding:14px 16px;margin-bottom:20px;}
  .ai-box label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass-dark);margin-bottom:6px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);margin-bottom:5px;}
  .field input,.field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:3px;font-family:'Source Serif 4',serif;font-size:14.5px;background:var(--paper);}
  .field input.mono{font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;justify-content:space-between;margin-top:20px;gap:10px;}
  .modal-actions .right{display:flex;gap:8px;}

  @media (max-width:800px){
    .ficha-header{grid-template-columns:1fr;text-align:left;gap:6px;}
    .vencimiento{text-align:left;}
    .estado-pill{width:fit-content;}
    .stats{grid-template-columns:1fr 1fr;}
    .stamp{display:none;}
  }
  /* Sincronización entre compus */
  #sync-pill{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--folder-dark);color:var(--white-ish);border:none;border-radius:999px;padding:10px 18px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;z-index:60;max-width:calc(100% - 32px);}
  #sync-pill.hidden{display:none;}
  #sync-pill .sync-accion{color:var(--brass);font-weight:600;margin-left:8px;text-decoration:underline;}
  #sync-toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ok);color:#fff;border-radius:999px;padding:9px 16px;font-family:'IBM Plex Mono',monospace;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:61;opacity:0;pointer-events:none;transition:opacity .25s ease;}
  #sync-toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app" class="hidden">
  <div class="masthead">
    <div>
      <div class="eyebrow">Libro de novedades · respaldado en GitHub</div>
      <h1>Registro de Pericias Contables</h1>
    </div>
    <div class="masthead-actions">
      <button class="btn btn-ghost" id="btn-config">🔒 Bloquear</button>
      <button class="btn btn-brass" id="btn-nueva">+ Nueva pericia</button>
    </div>
  </div>

  <div id="conn-bar" class="conn-bar conn-warn"><span class="dot"></span><span id="conn-text">Sin configurar todavía</span></div>

  <!-- VISTA: listado principal -->
  <div id="view-list">
    <div class="stats" id="stats"></div>

    <div class="controls">
      <input id="search" type="text" placeholder="Buscar por expediente, carátula o contador…">
      <select id="filter-contador"><option value="">Todos los contadores</option></select>
      <select id="filter-organismo"><option value="">Todos los organismos</option></select>
      <select id="filter-estado"><option value="">Todos los estados</option></select>
      <select id="sort-by">
        <option value="reciente" selected>Ordenar: movimiento más reciente</option>
        <option value="vencimiento">Ordenar: vencimiento más próximo</option>
        <option value="expediente">Ordenar: n° de expediente</option>
        <option value="alfabetico">Ordenar: alfabético (carátula)</option>
      </select>
    </div>

    <div id="list"></div>
  </div>

  <!-- VISTA: detalle de un juicio -->
  <div id="view-detail" class="hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;">
      <button class="btn btn-ghost btn-small" id="btn-volver">← Volver al listado</button>

<script>
const CONTADORES = ['Garate, Alejandra', 'Malzone, Roxana', 'Iogha, Romina', 'Giovanetti, Marcela', 'Cebrero, Luciana', 'Salvanhac, Daniela', 'Morettini, Gabriela', 'Mendiguren, María Marta'];

const JUZGADOS_GRUPOS = [
  { grupo: 'Cámaras', items: [
    'Cámara Civil y Comercial - Presidencia',
    'Cámara de Apelación en lo Civil y Comercial - Sala 1ra',
    'Cámara de Apelación en lo Civil y Comercial - Sala 2da',
    'Cámara de Apelación en lo Civil y Comercial - Sala 3ra',
    'Cámara de Apelación en lo Contencioso Administrativo',
  ]},
  { grupo: 'Juzgados Civil y Comercial', items: Array.from({length:16}, (_,i) => `Juzgado Civil y Comercial N° ${i+1}`) },
  { grupo: 'Contencioso Administrativo', items: [
    'Juzgado Contencioso Administrativo N° 1',
    'Juzgado Contencioso Administrativo N° 2',
  ]},
  { grupo: 'Otros', items: ['Secretaria de Apremios'] },
  { grupo: 'Tribunales de Trabajo', items: Array.from({length:5}, (_,i) => `Tribunal de Trabajo N° ${i+1}`) },
];
const JUZGADOS = JUZGADOS_GRUPOS.flatMap(g => g.items);

function poblarSelectJuzgado(){
  const sel = document.getElementById('f-juzgado');
  if(!sel) return;
  sel.innerHTML = '<option value="">Seleccionar…</option>' +
    JUZGADOS_GRUPOS.map(g => `<optgroup label="${escapeHtml(g.grupo)}">${g.items.map(j => `<option value="${escapeHtml(j)}">${escapeHtml(j)}</option>`).join('')}</optgroup>`).join('') +
    '<option value="__otro__">Otro / no está en la lista…</option>';
}

function normalizarTextoJuzgado(s){
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[°º.]/g,'').replace(/\s+/g,' ').trim();
}

// Interpreta texto libre (ej. "Trib. de Trabajo 2", "Juz. Civ y Com N°4") y busca la opción fija equivalente.
function matchJuzgado(textoLibre){
  if(!textoLibre) return '';
  const t = normalizarTextoJuzgado(textoLibre);

  const exacto = JUZGADOS.find(j => normalizarTextoJuzgado(j) === t);
  if(exacto) return exacto;

  const numMatch = t.match(/(\d+)/);
  const numero = numMatch ? numMatch[1] : null;

  const esCamara = /camara/.test(t);
  const esTrabajo = /trabaj/.test(t);
  const esContencioso = /contencios/.test(t);
  const esApremio = /apremio/.test(t);
  const esCivilComercial = /civ/.test(t) && /com/.test(t) && !esContencioso && !esTrabajo;
  const esPresidencia = /presidencia/.test(t);
  const salaMatch = t.match(/sala\s*(1ra|2da|3ra|primera|segunda|tercera|\d)/);

  if(esApremio) return 'Secretaria de Apremios';

  if(esCamara){
    if(esContencioso) return 'Cámara de Apelación en lo Contencioso Administrativo';
    if(esPresidencia && !salaMatch) return 'Cámara Civil y Comercial - Presidencia';
    if(salaMatch){
      const salaMap = {'1':'1ra','1ra':'1ra','primera':'1ra','2':'2da','2da':'2da','segunda':'2da','3':'3ra','3ra':'3ra','tercera':'3ra'};
      const salaNum = salaMap[salaMatch[1]];
      if(salaNum) return `Cámara de Apelación en lo Civil y Comercial - Sala ${salaNum}`;
    }
    return '';
  }

  if(numero){
    let candidato = '';
    if(esTrabajo) candidato = `Tribunal de Trabajo N° ${numero}`;
    else if(esContencioso) candidato = `Juzgado Contencioso Administrativo N° ${numero}`;
    else if(esCivilComercial) candidato = `Juzgado Civil y Comercial N° ${numero}`;
    if(candidato){
      const encontrado = JUZGADOS.find(j => normalizarTextoJuzgado(j) === normalizarTextoJuzgado(candidato));
      if(encontrado) return encontrado;
    }
  }

  return '';
}

function setJuzgadoValue(textoLibre){
  const sel = document.getElementById('f-juzgado');
  const otro = document.getElementById('f-juzgado-otro');
  if(!sel || !otro) return;
  const match = matchJuzgado(textoLibre);
  if(match){
    sel.value = match;
    otro.value = '';
    otro.classList.add('hidden');
  } else if(textoLibre){
    sel.value = '__otro__';
    otro.value = textoLibre;
    otro.classList.remove('hidden');
  } else {
    sel.value = '';
    otro.value = '';
    otro.classList.add('hidden');
  }
}

function getJuzgadoValue(){
  const sel = document.getElementById('f-juzgado');
  if(!sel) return '';
  if(sel.value === '__otro__') return document.getElementById('f-juzgado-otro').value.trim();
  return sel.value;
}

const DATA_PATH = 'pericias.json';
const CONFIG_FILE = 'config.enc.json';
const SESSION_KEY = 'gh-pericias-session';
let pericias = [];
let modoResolverIA = false; // false = vista simple de puntos periciales (como antes); true = modo edición con IA
let currentSha = null;
let basePericias = []; // última versión confirmada en GitHub (base para combinar cambios simultáneos)
let config = null; // { owner, repo, branch, token } — solo en memoria/sessionStorage, nunca en disco
let saving = false;

const ESTADO_COLOR = {

  'Cargo aceptado': 'var(--brass)',
  'En elaboración': 'var(--teal)',
  'Presentada': 'var(--ok)',
  'Observada / impugnada': 'var(--alert)',

};

  'Cargo aceptado': 'Cargo aceptado',
  'En elaboración': 'En elaboración',
  'Presentada': 'Presentada',
  'Observada / impugnada': 'Observada',

  'Dictamen presentado pero no cobrada': 'Dictamen sin cobrar',

function uid(){ return 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

/* ---------- Unicode-safe base64 helpers ---------- */
function utf8ToB64(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function b64ToUtf8(b64){
  const bin = atob(b64.replace(/\n/g,''));
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ---------- Cifrado (PBKDF2 + AES-GCM) ---------- */
function b64ToBytes(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
async function deriveKey(pin, saltBytes, iterations){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pin), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: saltBytes, iterations, hash:'SHA-256'},
    keyMaterial, {name:'AES-GCM', length:256}, false, ['decrypt']
  );
}
async function decryptConfig(pin, blob){
  const salt = b64ToBytes(blob.salt);
  const iv = b64ToBytes(blob.iv);
  const data = b64ToBytes(blob.data);
  const key = await deriveKey(pin, salt, blob.iterations);
  const plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data); // lanza error si el PIN es incorrecto
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

// Clave separada (misma sal, distinta cadena de origen) usada para cifrar los DATOS de las pericias,
// no solo el token. Así, aunque alguien acceda al archivo pericias.json directamente, ve solo texto cifrado.
async function deriveDataKey(pin, saltBytes, iterations){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pin + '::datos'), {name:'PBKDF2'}, false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: saltBytes, iterations, hash:'SHA-256'},
    keyMaterial, {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']
  );
  const raw = await crypto.subtle.exportKey('raw', key);
  return b64FromBytes(new Uint8Array(raw));
}
function b64FromBytes(bytes){
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
async function importDataKey(dataKeyB64){
  return crypto.subtle.importKey('raw', b64ToBytes(dataKeyB64), {name:'AES-GCM'}, false, ['encrypt','decrypt']);
}
async function encryptData(dataKeyB64, obj){
  const key = await importDataKey(dataKeyB64);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const plaintext = new TextEncoder().encode(JSON.stringify(obj));
  const cipherBuf = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, plaintext);
  return JSON.stringify({ enc: true, iv: b64FromBytes(iv), data: b64FromBytes(new Uint8Array(cipherBuf)) });
}
async function decryptData(dataKeyB64, jsonText){
  let parsed;
  try{ parsed = JSON.parse(jsonText); }catch(e){ throw new Error('Archivo de datos inválido.'); }
  if(Array.isArray(parsed)) return parsed; // formato viejo sin cifrar (migración automática al primer guardado)
  if(!parsed || !parsed.enc) throw new Error('Archivo de datos con formato desconocido.');
  const key = await importDataKey(dataKeyB64);
  const iv = b64ToBytes(parsed.iv);
  const data = b64ToBytes(parsed.data);
  const plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data);
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

let encryptedBlob = null;
async function fetchEncryptedConfig(){
  if(encryptedBlob) return encryptedBlob;
  const res = await fetch(CONFIG_FILE + '?t=' + Date.now());

/* ---------- GitHub API ---------- */
function ghHeaders(){
  return {
    'Authorization': 'Bearer ' + config.token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
}
function ghUrl(){
  return `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${DATA_PATH}`;
}

// Trae la versión actual de GitHub sin tocar el estado de la app.
async function ghFetchRemote(){
  const res = await fetch(`${ghUrl()}?ref=${encodeURIComponent(config.branch)}&t=${Date.now()}`, { headers: ghHeaders(), cache:'no-store' });
  if(res.status === 404) return { sha:null, data:[] };
  if(res.status === 401 || res.status === 403) throw new Error('AUTH');
  if(!res.ok) throw new Error('HTTP_' + res.status);
  const json = await res.json();
  const rawText = b64ToUtf8(json.content);
  return { sha: json.sha, data: await decryptData(config.dataKey, rawText) };
}

async function ghLoad(){
  const remote = await ghFetchRemote();
  currentSha = remote.sha;
  basePericias = clonar(remote.data);
  return remote.data;
}

/* ---------- Combinación de cambios simultáneos (3 vías: base / mío / remoto) ----------
   Si otra compu guardó mientras yo editaba, GitHub rechaza mi guardado (409).
   En vez de perder el cambio, se trae lo remoto, se combina campo por campo
   (y por id en listas como pericias, novedades y documentos) y se vuelve a guardar.
   Solo si los dos editaron exactamente el mismo campo gana el último que guarda. */
function clonar(o){ return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }
function iguales(a, b){ return JSON.stringify(a) === JSON.stringify(b); }
function esObjetoPlano(x){ return x !== null && typeof x === 'object' && !Array.isArray(x); }
function esListaConIds(x){ return Array.isArray(x) && x.length > 0 && x.every(e => esObjetoPlano(e) && e.id !== undefined); }

function merge3(base, mio, remoto){
  if(iguales(mio, remoto)) return mio;
  if(iguales(base, mio)) return remoto;
  if(iguales(base, remoto)) return mio;
  // Ambos cambiaron
  if(esObjetoPlano(mio) && esObjetoPlano(remoto)){
    const b = esObjetoPlano(base) ? base : {};
    const out = {};
    new Set([...Object.keys(mio), ...Object.keys(remoto), ...Object.keys(b)]).forEach(k => {
      const v = merge3(b[k], mio[k], remoto[k]);
      if(v !== undefined) out[k] = v;
    });
    return out;
  }
  if(Array.isArray(mio) && Array.isArray(remoto)){
    const b = Array.isArray(base) ? base : [];
    if((esListaConIds(mio) || mio.length === 0) && (esListaConIds(remoto) || remoto.length === 0) && (esListaConIds(b) || b.length === 0)){
      const porId = arr => new Map(arr.map(e => [e.id, e]));
      const mb = porId(b), mm = porId(mio), mr = porId(remoto);
      const orden = [...remoto.map(e => e.id), ...mio.map(e => e.id).filter(id => !mr.has(id))];
      const out = [];
      orden.forEach(id => {
        const v = merge3(mb.get(id), mm.get(id), mr.get(id));
        if(v !== undefined) out.push(v);
      });
      return out;
    }
    // Listas sin id (p. ej. respuestas a puntos periciales): posición por posición
    const largo = Math.max(mio.length, remoto.length);
    const out = [];
    for(let i = 0; i < largo; i++) out.push(merge3(b[i], mio[i], remoto[i]));
    return out;
  }
  return mio; // mismo dato editado en las dos compus: gana el último en guardar
}

async function ghPut(message){
  const encryptedPayload = await encryptData(config.dataKey, pericias);
  const body = { message, content: utf8ToB64(encryptedPayload), branch: config.branch };
  if(currentSha) body.sha = currentSha;
  return fetch(ghUrl(), { method:'PUT', headers: {...ghHeaders(), 'Content-Type':'application/json'}, body: JSON.stringify(body) });
}

// Devuelve true si tuvo que combinar con cambios de otra compu.
async function ghSave(_data, message){
  let combinado = false;
  for(let intento = 0; intento < 4; intento++){
    const res = await ghPut(message);
    if(res.status === 401 || res.status === 403) throw new Error('AUTH');
    if(res.status === 409 || res.status === 422){
      const remoto = await ghFetchRemote();
      pericias = merge3(basePericias, pericias, remoto.data);
      basePericias = clonar(remoto.data);
      currentSha = remoto.sha;
      combinado = true;
      continue;
    }
    if(!res.ok) throw new Error('HTTP_' + res.status);
    const json = await res.json();
    currentSha = json.content.sha;
    basePericias = clonar(pericias);
    return combinado;
  }
  throw new Error('CONFLICTO');
}

function showApp(){ document.getElementById('app').classList.remove('hidden'); }
function hideApp(){ document.getElementById('app').classList.add('hidden'); }
function setLoginStatus(text){ document.getElementById('login-conn-text').textContent = text || ''; }

async function connectAndLoad(){
  if(!config || !config.owner || !config.repo || !config.token){
    hideApp();
    openPinPrompt();
    return;
  }
  setLoginStatus('Conectando con ' + config.owner + '/' + config.repo + '…');
  try{
    pericias = await ghLoad();
    setConn('ok', 'Conectado a ' + config.owner + '/' + config.repo + ' (rama ' + config.branch + ')');
    closePinPrompt();
    showApp();
    renderAll();
  }catch(e){
    clearSession();
    hideApp();
    openPinPrompt();

    if(e.message === 'AUTH'){
      errorDiv.textContent = 'PIN incorrecto, o el token no tiene permisos sobre ese repositorio.';
    } else {
      errorDiv.textContent = 'No se pudo conectar (' + e.message + '). Revisá tu conexión e intentá de nuevo.';
    }
    errorDiv.style.display = 'block';
  }
}

// Los guardados se encolan para que dos clics seguidos no se pisen entre sí.
let colaGuardado = Promise.resolve();
function persist(message){
  colaGuardado = colaGuardado.then(() => persistAhora(message));
  return colaGuardado;
}
async function persistAhora(message){
  saving = true;
  setConn('warn', 'Guardando en GitHub…');
  try{
    const combinado = await ghSave(pericias, message);
    setConn('ok', 'Conectado a ' + config.owner + '/' + config.repo + ' · guardado ✓');
    if(combinado){
      renderConScroll();
      mostrarToast('Guardado ✓ · se sumaron cambios hechos desde otra compu');
    }
    remotoPendiente = null; // lo guardado ya incluye todo lo remoto
    ocultarPillSync();
  }catch(e){
    setConn('error', e.message === 'AUTH' ? 'Token inválido o expirado, no se pudo guardar.' : 'Error al guardar (' + e.message + ').');
    alert('No se pudo guardar en GitHub. Revisá la configuración y volvé a intentar.');
  }
  saving = false;
}

/* ---------- Sincronización automática entre compus ----------
   Cada 30 segundos (y al volver a la ventana) se consulta si alguien guardó algo.
   Si estás en medio de algo (escribiendo, con un formulario abierto o en
   "Resolver con IA") no se toca la pantalla: aparece un aviso para actualizar. */
const SYNC_CADA_MS = 30000;
let remotoPendiente = null;
let chequeandoSync = false;

function renderConScroll(){
  const y = window.scrollY;
  renderAll();
  window.scrollTo(0, y);
}
function mostrarToast(texto){
  const t = document.getElementById('sync-toast');
  t.textContent = texto;
  t.classList.add('show');
  clearTimeout(mostrarToast._t);
  mostrarToast._t = setTimeout(() => t.classList.remove('show'), 3200);
}
function ocultarPillSync(){ document.getElementById('sync-pill').classList.add('hidden'); }

function usuarioOcupado(){
  if(saving) return true;
  if(!document.getElementById('modal-overlay').classList.contains('hidden')) return true;
  if(modoResolverIA) return true;
  const a = document.activeElement;
  if(a && a.closest && a.closest('#app') && (a.tagName === 'TEXTAREA' || a.isContentEditable || (a.tagName === 'INPUT' && a.type !== 'file' && a.id !== 'search'))) return true;
  // Texto escrito y todavía no guardado en los cuadros de novedad / IA / búsqueda
  const borradores = document.querySelectorAll('#app textarea, #view-detail input[type="text"]');
  for(const el of borradores){ if(el.value && el.value !== el.defaultValue) return true; }
  if(document.querySelector('#app input[type="file"]') && [...document.querySelectorAll('#app input[type="file"]')].some(f => f.files && f.files.length)) return true;
  if(typeof archivosAcumulados === 'object' && archivosAcumulados && Object.values(archivosAcumulados).some(v => v && Object.keys(v).length)) return true;
  return false;
}

function aplicarCambiosRemotos(forzar){
  if(!remotoPendiente) return;
  if(!forzar && usuarioOcupado()){
    document.getElementById('sync-pill').classList.remove('hidden');
    return;
  }
  if(saving) return; // se reintenta en el próximo chequeo
  pericias = remotoPendiente.data;
  basePericias = clonar(remotoPendiente.data);
  currentSha = remotoPendiente.sha;
  remotoPendiente = null;
  ocultarPillSync();
  if(forzar && modoResolverIA){ renderAll(); } else { renderConScroll(); }
  mostrarToast('Actualizado con cambios de otra compu');
}

async function chequearCambiosRemotos(){
  if(chequeandoSync || saving || !config || document.hidden) return;
  if(document.getElementById('app').classList.contains('hidden')) return;
  chequeandoSync = true;
  try{
    const remoto = await ghFetchRemote();
    if(remoto.sha && remoto.sha !== currentSha && !saving){
      remotoPendiente = remoto;
      aplicarCambiosRemotos(false);
    } else if(remotoPendiente && !usuarioOcupado()){
      aplicarCambiosRemotos(false);
    }
  }catch(e){ /* sin conexión o error puntual: se reintenta en el próximo ciclo */ }
  chequeandoSync = false;
}
setInterval(chequearCambiosRemotos, SYNC_CADA_MS);
document.addEventListener('visibilitychange', () => { if(!document.hidden) chequearCambiosRemotos(); });
window.addEventListener('focus', chequearCambiosRemotos);
window.addEventListener('online', chequearCambiosRemotos);

/* ---------- Utilidades de fecha ---------- */
function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}
function fmtDate(dateStr){
  if(!dateStr) return '—';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function venciClass(dateStr, estado){
  if(estado === 'Homologada / finalizada' || !dateStr) return 'venc-ok';
  const d = daysUntil(dateStr);
  if(d < 0) return 'venc-alert';
  if(d <= 7) return 'venc-warn';
  return 'venc-ok';
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

/* ---------- Render ---------- */
function populateFilters(){
  const contadorSel = document.getElementById('filter-contador');
  const organismoSel = document.getElementById('filter-organismo');
  const estadoSel = document.getElementById('filter-estado');
  const currentContador = contadorSel.value;
  contadorSel.innerHTML = '<option value="">Todos los contadores</option>' + CONTADORES.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  contadorSel.value = currentContador;
  const currentOrganismo = organismoSel.value;
  const organismos = [...new Set(pericias.map(p => p.juzgado).filter(Boolean))].sort();
  organismoSel.innerHTML = '<option value="">Todos los organismos</option>' + organismos.map(o => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('');
  organismoSel.value = currentOrganismo;
  if(estadoSel.options.length <= 1){
    estadoSel.innerHTML = '<option value="">Todos los estados</option>' + Object.keys(ESTADO_COLOR).map(e => `<option value="${e}">${e}</option>`).join('');
  }
}

function renderStats(){
  const total = pericias.length;
  const sinCobrar = pericias.filter(p => p.estado === 'Dictamen presentado pero no cobrada').length;
  const cobradas = pericias.filter(p => p.estado === 'Pericia Cobrada').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="stat-num mono">${total}</div><div class="stat-label">Pericias activas</div></div>
    <div class="stat-card warn-stat"><div class="stat-num mono">${sinCobrar}</div><div class="stat-label">Dictamen presentado pero no cobrada</div></div>
    <div class="stat-card"><div class="stat-num mono" style="color:var(--ok);">${cobradas}</div><div class="stat-label">Pericia Cobrada</div></div>
  `;
}

function getFiltered(){
  const search = document.getElementById('search').value.trim().toLowerCase();
  const contador = document.getElementById('filter-contador').value;
  const organismo = document.getElementById('filter-organismo').value;
  const estado = document.getElementById('filter-estado').value;
  const sortBy = document.getElementById('sort-by').value;
  let list = pericias.filter(p => {
    if(contador && p.contador !== contador) return false;
    if(organismo && p.juzgado !== organismo) return false;
    if(estado && p.estado !== estado) return false;
    if(search){
      const blob = `${p.expediente} ${p.caratula} ${p.contador} ${p.juzgado}`.toLowerCase();
      if(!blob.includes(search)) return false;
    }
    return true;
  });
  if(sortBy === 'vencimiento'){
    list.sort((a,b) => {
      if(!a.vencimiento && !b.vencimiento) return 0;
      if(!a.vencimiento) return 1;
      if(!b.vencimiento) return -1;
      return new Date(a.vencimiento) - new Date(b.vencimiento);
    });
  } else if(sortBy === 'reciente'){
    list.sort((a,b) => new Date(ultimoMovimiento(b) || 0) - new Date(ultimoMovimiento(a) || 0));
  } else if(sortBy === 'alfabetico'){
    list.sort((a,b) => (a.caratula||'').localeCompare(b.caratula||'', 'es', {sensitivity:'base'}));
  } else {
    list.sort((a,b) => (a.expediente||'').localeCompare(b.expediente||'', undefined, {numeric:true}));
  }
  return list;
}

function ultimoMovimiento(p){
  const fechas = [
    ...(p.novedades || []).map(n => n.fecha),
    ...(p.documentos || []).map(d => d.fecha),
    p.fecha_designacion || ''
  ].filter(Boolean);
  if(fechas.length === 0) return '';
  return fechas.reduce((max, f) => new Date(f) > new Date(max) ? f : max, fechas[0]);
}

function truncarTexto(texto, max){
  const t = (texto || '').trim();
  if(t.length <= max) return t;
  return t.slice(0, max).trim() + '…';
}

function getUltimaNovedad(p){
  if(!p.novedades || !p.novedades.length) return null;
  return [...p.novedades].sort((a,b) => new Date(b.fecha) - new Date(a.fecha))[0];
}

function renderList(){
  const list = getFiltered();
  const container = document.getElementById('list');
  if(!config){
    container.innerHTML = `<div class="empty">Configurá tu repositorio de GitHub (botón "⚙ Configuración") para empezar a cargar pericias.</div>`;
    return;
  }
  if(pericias.length === 0){
    container.innerHTML = `<div class="empty">Todavía no cargaste ninguna pericia.<br>Usá "+ Nueva pericia" para empezar el registro.</div>`;
    return;
  }
  if(list.length === 0){
    container.innerHTML = `<div class="empty">No hay pericias que coincidan con la búsqueda o los filtros.</div>`;
    return;
  }
  container.innerHTML = list.map(p => {
    const color = ESTADO_COLOR[p.estado] || 'var(--slate)';
    const vClass = venciClass(p.vencimiento, p.estado);
    const isFinal = p.estado === 'Homologada / finalizada';
    const ultima = getUltimaNovedad(p);
    return `
      <article class="ficha" data-tab-label="${escapeHtml(ESTADO_ABBR[p.estado] || p.estado)}" style="--tab-color:${color}">
        ${isFinal ? '<div class="stamp">HOMOLOGADA</div>' : ''}
        <div class="ficha-header" onclick="location.hash = 'p/' + '${p.id}'">
          <div class="expediente">EXPTE.<br>${escapeHtml(p.expediente || 's/n°')}</div>
          <div class="caratula">${escapeHtml(p.caratula || '(sin carátula cargada)')}<span class="juzgado-mini">${escapeHtml(p.juzgado || '')}</span>${ultima ? `<span class="ultimo-acontecimiento">Último acontecimiento: <span class="ultimo-fecha">${fmtDate(ultima.fecha)}</span> — ${escapeHtml(truncarTexto(ultima.texto, 140))}</span>` : ''}</div>
          <div class="badge-contador">${escapeHtml(p.contador || '—')}</div>
          <div class="estado-pill" style="background:${color}">${escapeHtml(p.estado)}</div>
          <div class="vencimiento ${vClass}"><span class="lbl">Vencimiento</span>${fmtDate(p.vencimiento)}</div>
        </div>
      </article>
    `;
  }).join('');
}

function renderAll(){ populateFilters(); renderStats(); renderRoute(); }

/* ---------- Ruteo (hash: '' = listado, 'p/ID' = detalle de un juicio) ---------- */
function currentRoute(){
  const hash = location.hash.replace(/^#/, '');
  const mLiq = hash.match(/^p\/([^/]+)\/liquidacion\/([^/]+)$/);
  if(mLiq) return { view:'liquidacion', id: mLiq[1], origen: decodeURIComponent(mLiq[2]) };
  const mPericial = hash.match(/^p\/(.+)\/pericial$/);
  if(mPericial) return { view:'pericial', id: mPericial[1] };
  const m = hash.match(/^p\/(.+)$/);
  return m ? { view:'detail', id: m[1] } : { view:'list' };
}

function renderRoute(){
  const route = currentRoute();
  const viewList = document.getElementById('view-list');
  const viewDetail = document.getElementById('view-detail');
  const viewPericial = document.getElementById('view-pericial');
  const viewLiquidacion = document.getElementById('view-liquidacion');
  const todas = [viewList, viewDetail, viewPericial, viewLiquidacion];

  if(route.view === 'liquidacion'){
    const p = pericias.find(x => x.id === route.id);
    if(!p){ location.hash = ''; return; }
    todas.forEach(v => v.classList.add('hidden'));
    viewLiquidacion.classList.remove('hidden');
    renderLiquidacionDetalle(p, route.origen);
  } else if(route.view === 'pericial'){
    const p = pericias.find(x => x.id === route.id);
    if(!p){ location.hash = ''; return; }
    todas.forEach(v => v.classList.add('hidden'));
    viewPericial.classList.remove('hidden');
    modoResolverIA = false;
    const btnToggle = document.getElementById('btn-toggle-resolver-ia');
    if(btnToggle) btnToggle.textContent = '🤖 Resolver con IA';
    renderPericial(p);
  } else if(route.view === 'detail'){
    const p = pericias.find(x => x.id === route.id);
    if(!p){ location.hash = ''; return; }
    todas.forEach(v => v.classList.add('hidden'));
    viewDetail.classList.remove('hidden');
    renderDetail(p);
  } else {
    todas.forEach(v => v.classList.add('hidden'));
    viewList.classList.remove('hidden');
    renderList();
  }
}

/* ---------- Utilidad: parsear/formatear montos en formato AR ($1.234.567,89) ---------- */
function parseMonto(str){
  if(!str) return 0;
  let s = String(str).replace(/[^\d.,\-]/g, '');
  s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function formatMonto(n){
  return '$' + n.toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function renderPuntoConRespuesta(texto, respuesta, periciaId, origen, parteIdx, puntoIdx){

    </li>`;
}

/* Arma el HTML interno de un bloque de puntos periciales, SIN acciones ni
   respuestas editables — se usa en la vista previa de IA antes de confirmar
   un documento, cuando todavía no existe periciaId/origen para guardar nada. */
function buildPuntosPericialesHtml(puntos, postura, modo, partes){
  const tienePostura = postura && postura.trim();
  if(tienePostura) return `<div class="pericial-sin">${escapeHtml(postura)}</div>`;

  const tienePartes = modo === 'separado' && Array.isArray(partes) && partes.some(g => Array.isArray(g.puntos) && g.puntos.length);
  if(tienePartes){
    return partes.filter(g => Array.isArray(g.puntos) && g.puntos.length).map(g => `
      <div class="pericial-parte">
        <div class="pericial-parte-nombre">${escapeHtml(g.parte || 'Parte sin nombre')}</div>
        <ol class="puntos-list">${g.puntos.map(pt => `<li>${escapeHtml(pt)}</li>`).join('')}</ol>
      </div>`).join('');
  }

  const tienePuntos = Array.isArray(puntos) && puntos.length > 0;
  if(tienePuntos) return `<ol class="puntos-list">${puntos.map(pt => `<li>${escapeHtml(pt)}</li>`).join('')}</ol>`;

  return '';
}

/* Bloque real de "Puntos periciales" en la vista Pericial Contable: incluye el
   botón "Resolver puntos con IA" (analiza documentación contable subida y
   redacta un borrador de respuesta para cada punto), el botón para copiar el
   borrador completo, y cada punto con su respuesta editable a mano. */
function renderPuntosPericialesBloque(fuente, puntos, postura, modo, partes, respuestasFlat, periciaId, origen){
  const tienePostura = postura && postura.trim();
  const tienePartes = modo === 'separado' && Array.isArray(partes) && partes.some(g => Array.isArray(g.puntos) && g.puntos.length);
  const tienePuntos = Array.isArray(puntos) && puntos.length > 0;
  if(!tienePostura && !tienePartes && !tienePuntos) return '';

  if(!modoResolverIA){
    // Vista simple, tal como estaba antes: solo la lista de puntos, sin acciones ni respuestas editables.
    const cuerpoSimple = buildPuntosPericialesHtml(puntos, postura, modo, partes);
    if(!cuerpoSimple) return '';
    return `
      <div class="pericial-bloque">
        <h3>Puntos periciales <span class="fuente">· ${escapeHtml(fuente)}</span></h3>
        ${cuerpoSimple}
      </div>`;
  }

  let cuerpo, acciones = '';
  if(tienePostura){
    cuerpo = `<div class="pericial-sin">${escapeHtml(postura)}</div>`;
  } else if(tienePartes){
    cuerpo = partes.map((g, gi) => {
      if(!Array.isArray(g.puntos) || !g.puntos.length) return '';
      return `
        <div class="pericial-parte">
          <div class="pericial-parte-nombre">${escapeHtml(g.parte || 'Parte sin nombre')}</div>
          <ol class="puntos-list">${g.puntos.map((pt, pi) => renderPuntoConRespuesta(pt, g.respuestas && g.respuestas[pi], periciaId, origen, gi, pi)).join('')}</ol>
        </div>`;
    }).join('');
    acciones = renderAccionesPuntos(periciaId, origen);
  } else {
    cuerpo = `<ol class="puntos-list">${puntos.map((pt, pi) => renderPuntoConRespuesta(pt, respuestasFlat && respuestasFlat[pi], periciaId, origen, -1, pi)).join('')}</ol>`;
    acciones = renderAccionesPuntos(periciaId, origen);
  }

  return `
    <div class="pericial-bloque">
      <h3>Puntos periciales <span class="fuente">· ${escapeHtml(fuente)}</span></h3>
      ${acciones}
      ${cuerpo}
    </div>`;
}

function renderLiquidacionBloque(fuente, liquidacion, origen, periciaId){
  if(!Array.isArray(liquidacion) || liquidacion.length === 0) return '';
  const total = liquidacion.reduce((sum, r) => sum + parseMonto(r.monto), 0);
  return `
    <div class="pericial-bloque">
      <h3 class="clickable" style="cursor:pointer;" onclick="location.hash='p/${periciaId}/liquidacion/${encodeURIComponent(origen)}'">
        Liquidación <span class="fuente">· ${escapeHtml(fuente)}</span>
        <span style="font-size:11px;color:var(--slate);text-transform:none;font-weight:normal;">→ ver cómo se calculó cada rubro</span>
      </h3>
      <table class="liq-table">
        ${liquidacion.map(r => `<tr><td>${escapeHtml(r.rubro || '')}</td><td>${escapeHtml(r.monto || '')}</td></tr>`).join('')}
        <tr class="total"><td>Total</td><td>${formatMonto(total)}</td></tr>
      </table>

/* ---------- Novedades: clasificación personal vs. expediente ---------- */
let novFiltroActual = 'todas';
let novOrigenManual = null; // null = auto, o 'personal' / 'expediente' si el usuario lo forzó

function classifyNovedadTexto(texto){
  return (texto || '').trim().length > 180 ? 'expediente' : 'personal';
}

function inferNovedadOrigen(n){
  return n.origen === 'personal' || n.origen === 'expediente' ? n.origen : classifyNovedadTexto(n.texto);
}

function onNovTextoInput(){
  if(novOrigenManual) return; // el usuario ya eligió a mano, no lo pisamos
  const texto = document.getElementById('detail-nov-texto').value;
  renderNovOrigenToggle(classifyNovedadTexto(texto));
}

function setNovOrigenManual(origen){
  novOrigenManual = origen;
  renderNovOrigenToggle(origen);
}

function renderNovOrigenToggle(activo){
  const texto = document.getElementById('detail-nov-texto');
  const origenActivo = activo || novOrigenManual || classifyNovedadTexto(texto ? texto.value : '');
  document.querySelectorAll('#nov-origen-toggle .nov-origen-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-origen') === origenActivo);
  });
}

function setNovFiltro(filtro){
  novFiltroActual = filtro;
  document.querySelectorAll('#nov-filter .nov-filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-filtro') === filtro);
  });
  const route = currentRoute();
  if(route.view === 'detail'){
    const p = pericias.find(x => x.id === route.id);
    if(p) renderNovedadesList(p);
  }
}

function renderNovedadesList(p){
  const todas = [...p.novedades].sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
  const filtradas = novFiltroActual === 'todas'
    ? todas
    : todas.filter(n => inferNovedadOrigen(n) === novFiltroActual);

  const container = document.getElementById('detail-novedades');
  if(todas.length === 0){
    container.innerHTML = '<div class="no-novedades">Sin novedades registradas todavía. Agregá la primera abajo.</div>';
    return;
  }
  if(filtradas.length === 0){
    container.innerHTML = '<div class="no-novedades">No hay novedades que coincidan con este filtro.</div>';
    return;
  }
  container.innerHTML = filtradas.map(n => {
    const origen = inferNovedadOrigen(n);
    const esPersonal = origen === 'personal';
    return `
        <article class="nov-card" id="bloque-nov-${n.id}" data-tab-label="${fmtDate(n.fecha)}" style="--tab-color:${esPersonal ? 'var(--teal)' : 'var(--brass)'};">
          <button class="nov-del" onclick="deleteNovedad('${p.id}','${n.id}')">Eliminar</button>
          <span class="nov-tag ${esPersonal ? 'nov-tag-personal' : 'nov-tag-expediente'}">${esPersonal ? '🖊 Anotaciones' : '📄 Expediente'}</span>
          <div class="nov-texto">${escapeHtml(n.texto)}</div>
        </article>
      `;
  }).join('');
}

function toggleContestacionView(){
  const bloque = document.getElementById('bloque-header');
  const vDemanda = document.getElementById('vista-demanda');
  const vContest = document.getElementById('vista-contestacion');
  if(!bloque || !vDemanda || !vContest) return;

  const mostrandoContestacion = !vContest.classList.contains('hidden');

    vContest.classList.add('hidden');

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result; // data:<mime>;base64,<data>
      const base64 = result.split(',')[1];
      resolve(base64);
    };
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

// Acumula archivos elegidos entre distintas aperturas del selector, en vez de que
// el navegador reemplace la selección anterior por la nueva (comportamiento nativo
// de <input type="file">). Se guarda una lista por pericia+origen.
const archivosAcumulados = {};
function claveArchivos(periciaId, origen){ return periciaId + '::' + origen; }

function agregarArchivosAcumulados(periciaId, origen){
  const fileInput = document.getElementById('resolver-archivos-' + origen);
  if(!fileInput) return;
  const clave = claveArchivos(periciaId, origen);
  if(!archivosAcumulados[clave]) archivosAcumulados[clave] = [];

  const nuevos = Array.from(fileInput.files || []);
  nuevos.forEach(f => {
    const yaEsta = archivosAcumulados[clave].some(existente =>
      existente.name === f.name && existente.size === f.size && existente.lastModified === f.lastModified
    );
    if(!yaEsta) archivosAcumulados[clave].push(f);
  });

  fileInput.value = ''; // limpia el input nativo para que la próxima elección no reemplace nada
  renderListaArchivos(periciaId, origen);
}

function eliminarArchivoAcumulado(periciaId, origen, idx){
  const clave = claveArchivos(periciaId, origen);
  if(!archivosAcumulados[clave]) return;
  archivosAcumulados[clave].splice(idx, 1);
  renderListaArchivos(periciaId, origen);
}

function vaciarArchivosAcumulados(periciaId, origen){
  const clave = claveArchivos(periciaId, origen);
  archivosAcumulados[clave] = [];
  renderListaArchivos(periciaId, origen);
}

function formatearTamano(bytes){
  const mb = bytes / (1024 * 1024);
  if(mb < 0.1) return (bytes / 1024).toFixed(0) + ' KB';
  return mb.toFixed(1) + ' MB';
}

function renderListaArchivos(periciaId, origen){
  const contenedor = document.getElementById('resolver-lista-' + origen);
  if(!contenedor) return;
  const clave = claveArchivos(periciaId, origen);
  const files = archivosAcumulados[clave] || [];

  if(!files.length){ contenedor.innerHTML = ''; return; }

  const totalMB = files.reduce((sum, f) => sum + f.size, 0) / (1024 * 1024);
  const cantidad = files.length + (files.length === 1 ? ' archivo' : ' archivos');
  let claseResumen = 'archivos-resumen';
  let avisoExtra = '';
  if(totalMB > 24){
    claseResumen += ' archivos-alerta';
    avisoExtra = ' — es demasiado, es muy probable que falle el análisis ("request too large"). Sacá algún archivo o comprimí los PDFs.';
  } else if(totalMB > 15){
    claseResumen += ' archivos-warn';
    avisoExtra = ' — se está acercando al límite. Si el análisis falla, sacá algún archivo.';
  }

  const chips = files.map((f, idx) => `
    <span class="archivo-chip">
      ${escapeHtml(f.name)} <span class="archivo-tam">(${formatearTamano(f.size)})</span>
      <button type="button" title="Sacar este archivo" onclick="eliminarArchivoAcumulado('${periciaId}','${origen}',${idx})">✕</button>
    </span>`).join('');

  contenedor.innerHTML = `
    <div class="${claseResumen}">${cantidad} seleccionados · ${totalMB.toFixed(1)} MB en total${avisoExtra}
      <button type="button" class="btn-vaciar-archivos" onclick="vaciarArchivosAcumulados('${periciaId}','${origen}')">Vaciar todo</button>
    </div>
    <div>${chips}</div>`;
}

async function guardarRespuestaPunto(periciaId, origen, parteIdx, puntoIdx, valor){
  const p = pericias.find(x => x.id === periciaId);
  if(!p) return;
  const target = origen === 'demanda' ? p : (p.documentos || []).find(d => d.id === origen);
  if(!target) return;
  if(parteIdx === -1){
    if(!Array.isArray(target.puntos_periciales_respuestas)) target.puntos_periciales_respuestas = [];
    target.puntos_periciales_respuestas[puntoIdx] = valor;
  } else {
    if(!Array.isArray(target.puntos_periciales_partes) || !target.puntos_periciales_partes[parteIdx]) return;
    const grupo = target.puntos_periciales_partes[parteIdx];
    if(!Array.isArray(grupo.respuestas)) grupo.respuestas = [];
    grupo.respuestas[puntoIdx] = valor;
  }
  await persist(`Actualiza borrador de respuesta pericial en expte. ${p.expediente || p.id}`);
}

function copiarBorradorPuntos(periciaId, origen){
  const p = pericias.find(x => x.id === periciaId);
  if(!p) return;
  const target = origen === 'demanda' ? p : (p.documentos || []).find(d => d.id === origen);
  if(!target) return;

  const modo = target.puntos_periciales_modo === 'separado' ? 'separado' : 'conjunto';
  let texto = '';
  if(modo === 'separado' && Array.isArray(target.puntos_periciales_partes)){
    target.puntos_periciales_partes.forEach(g => {
      const nombre = g.parte || 'Parte';
      texto += `${nombre}\n${'-'.repeat(nombre.length)}\n\n`;
      (g.puntos || []).forEach((pt, i) => {
        texto += `${i + 1}. ${pt}\nRespuesta: ${(g.respuestas && g.respuestas[i]) || '(sin resolver)'}\n\n`;
      });
      texto += '\n';
    });
  } else {
    (target.puntos_periciales || []).forEach((pt, i) => {
      texto += `${i + 1}. ${pt}\nRespuesta: ${(target.puntos_periciales_respuestas && target.puntos_periciales_respuestas[i]) || '(sin resolver)'}\n\n`;
    });
  }

  const btn = document.getElementById('btn-copiar-' + origen);
  navigator.clipboard.writeText(texto.trim()).then(() => {
    if(btn){ const orig = btn.textContent; btn.textContent = '✓ Copiado'; setTimeout(() => { btn.textContent = orig; }, 1500); }
  }).catch(() => {
    alert('No se pudo copiar automáticamente. Seleccioná el texto a mano.');
  });
}

async function resolverPuntosConIA(periciaId, origen){
  const p = pericias.find(x => x.id === periciaId);
  if(!p) return;
  const target = origen === 'demanda' ? p : (p.documentos || []).find(d => d.id === origen);
  if(!target) return;

  const statusDiv = document.getElementById('resolver-status-' + origen);
  const btn = document.getElementById('btn-resolver-' + origen);
  const files = archivosAcumulados[claveArchivos(periciaId, origen)] || [];

  if(!config || !config.workerUrl || !config.workerKey){
    statusDiv.style.color = 'var(--alert)';
    statusDiv.textContent = 'Todavía no configuraste el Worker de IA.';
    return;
  }
  if(!files.length){
    statusDiv.style.color = 'var(--alert)';
    statusDiv.textContent = 'Elegí al menos un archivo (libros, balances, facturas, extractos).';
    return;
  }

  const modo = target.puntos_periciales_modo === 'separado' ? 'separado' : 'conjunto';
  const puntosPayload = modo === 'separado'
    ? (target.puntos_periciales_partes || []).map(g => ({ parte: g.parte, puntos: g.puntos || [] }))
    : (target.puntos_periciales || []);
  const hayPuntos = modo === 'separado' ? puntosPayload.some(g => g.puntos.length) : puntosPayload.length > 0;
  if(!hayPuntos){
    statusDiv.style.color = 'var(--alert)';
    statusDiv.textContent = 'No hay puntos periciales cargados para resolver.';
    return;
  }

  btn.disabled = true;
  statusDiv.style.color = 'var(--slate)';
  statusDiv.textContent = 'Leyendo archivos…';

  let archivos;
  try{
    archivos = await Promise.all(files.map(async f => ({
      base64: await fileToBase64(f),
      mediaType: f.type || 'application/octet-stream',
      nombre: f.name
    })));
  }catch(e){
    statusDiv.style.color = 'var(--alert)';
    statusDiv.textContent = 'No se pudo leer alguno de los archivos.';
    btn.disabled = false;
    return;
  }

  statusDiv.textContent = 'Analizando documentación contable con IA… puede tardar un momento.';
  try{
    const res = await fetch(config.workerUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-App-Key': config.workerKey },
      body: JSON.stringify({ mode: 'resolver_puntos', puntos_periciales_modo: modo, puntos: puntosPayload, archivos })
    });
    const data = await res.json();
    if(!res.ok || !data.result){
      statusDiv.style.color = 'var(--alert)';
      statusDiv.textContent = 'No se pudo resolver (' + (data.error || res.status) + '). Revisá el Worker.';
      btn.disabled = false;
      return;
    }
    const r = data.result;
    /* Merge punto por punto: si en esta vuelta la IA no trae una respuesta nueva
       para un punto (porque los archivos subidos ahora no lo cubren), se conserva
       lo que ya estaba guardado de una vuelta anterior o cargado a mano — nunca
       se borra por venir vacío. Solo se pisa cuando llega texto nuevo real. */
    if(modo === 'separado'){
      if(Array.isArray(r.partes)){
        target.puntos_periciales_partes = (target.puntos_periciales_partes || []).map((g, i) => {
          const nuevas = (r.partes[i] && Array.isArray(r.partes[i].respuestas)) ? r.partes[i].respuestas : null;
          if(!nuevas) return g;
          const anteriores = Array.isArray(g.respuestas) ? g.respuestas : [];
          return { ...g, respuestas: nuevas.map((val, pi) => ((val || '').trim() ? val : (anteriores[pi] || ''))) };
        });
      }
    } else if(Array.isArray(r.respuestas)){
      const anteriores = Array.isArray(target.puntos_periciales_respuestas) ? target.puntos_periciales_respuestas : [];
      target.puntos_periciales_respuestas = r.respuestas.map((val, i) => ((val || '').trim() ? val : (anteriores[i] || '')));
    }
    await persist(`Resuelve puntos periciales con IA en expte. ${p.expediente || p.id}`);
    renderPericial(p);
  }catch(e){
    statusDiv.style.color = 'var(--alert)';
    statusDiv.textContent = 'Error de conexión con el Worker.';
    btn.disabled = false;
  }
}

async function analizarConIA(){
  const statusDiv = document.getElementById('ai-status');
  const btn = document.getElementById('btn-ai-analizar');
  statusDiv.style.color = 'var(--slate)';

  if(!config || !config.workerUrl || !config.workerKey){
    statusDiv.textContent = 'Todavía no configuraste el Worker de IA. Podés cargar los datos a mano mientras tanto.';
    return;
  }

  const texto = document.getElementById('ai-texto').value.trim();
  const fileInput = document.getElementById('ai-archivo');
  const file = fileInput.files[0];

  if(!texto && !file){
    statusDiv.textContent = 'Pegá un texto o elegí un archivo primero.';
    return;
  }

  let body;
  try{
    if(file){
      const base64 = await fileToBase64(file);
      body = { mode: 'file', fileBase64: base64, fileMediaType: file.type || 'application/pdf', tipo: 'inicial' };
    } else {
      body = { mode: 'text', text: texto, tipo: 'inicial' };
    }
  }catch(e){
    statusDiv.textContent = 'No se pudo leer el archivo.';
    return;
  }

  btn.disabled = true;
  statusDiv.textContent = 'Analizando con IA…';
  try{
    const res = await fetch(config.workerUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-App-Key': config.workerKey },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if(!res.ok || !data.result){
      statusDiv.style.color = 'var(--alert)';
      statusDiv.textContent = 'No se pudo analizar (' + (data.error || res.status) + '). Revisá el Worker o cargá a mano.';
      btn.disabled = false;
      return;
    }
    const r = data.result;
    if(r.expediente) document.getElementById('f-expediente').value = r.expediente;
    if(r.contador) document.getElementById('f-contador').value = r.contador;
    if(r.caratula) document.getElementById('f-caratula').value = r.caratula;
    if(r.juzgado) setJuzgadoValue(r.juzgado);
    if(r.estado) document.getElementById('f-estado').value = r.estado;
    if(r.resumen) document.getElementById('f-resumen').value = r.resumen;
    if(Array.isArray(r.datos_clave) && r.datos_clave.length){
      document.getElementById('f-datos-clave').value = JSON.stringify(r.datos_clave);
    }
    if(Array.isArray(r.puntos_periciales) && r.puntos_periciales.length){
      document.getElementById('f-puntos-periciales').value = JSON.stringify(r.puntos_periciales);
    }
    if(r.puntos_periciales_modo === 'separado' && Array.isArray(r.puntos_periciales_partes) && r.puntos_periciales_partes.length){
      document.getElementById('f-puntos-periciales-modo').value = 'separado';
      document.getElementById('f-puntos-periciales-partes').value = JSON.stringify(r.puntos_periciales_partes);
    }
    if(r.postura_pericial){
      document.getElementById('f-postura-pericial').value = r.postura_pericial;
    }
    if(Array.isArray(r.liquidacion) && r.liquidacion.length){
      document.getElementById('f-liquidacion').value = JSON.stringify(r.liquidacion);
    }
    statusDiv.style.color = 'var(--ok)';
    statusDiv.textContent = '✓ Listo — revisá los campos antes de guardar, la IA puede equivocarse.' + (data.truncado ? ' (Aviso: el texto era muy largo y se analizó solo una parte.)' : '');
  }catch(e){
    statusDiv.style.color = 'var(--alert)';
    statusDiv.textContent = 'Error de conexión con el Worker.';
  }
  btn.disabled = false;
}

let pendingDocPrincipal = null;

function renderAiPreview(){
  const preview = document.getElementById('detail-ai-preview');
  if(!pendingDocPrincipal){ preview.classList.add('hidden'); preview.innerHTML=''; return; }
  const d = pendingDocPrincipal;
  preview.classList.remove('hidden');
  preview.innerHTML = `
    <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass-dark);margin-bottom:8px;">${escapeHtml(d.tipo_documento)} · ${fmtDate(d.fecha)}</div>
    ${renderDatosClaveGrid(d.datos_clave)}
    <div style="font-size:14px;line-height:1.5;margin-top:10px;">${escapeHtml(d.resumen)}</div>
    ${(function(){
      const html = buildPuntosPericialesHtml(d.puntos_periciales, d.postura_pericial, d.puntos_periciales_modo, d.puntos_periciales_partes);
      if(!html) return '';
      const etiqueta = d.postura_pericial ? 'Postura sobre la prueba pericial' : 'Puntos periciales detectados';
      return `<div style="margin-top:10px;"><span class="lbl" style="display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--slate);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px;">${etiqueta}</span>${html}</div>`;
    })()}
    ${d.liquidacion && d.liquidacion.length ? `<div style="margin-top:10px;"><span class="lbl" style="display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--slate);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px;">Liquidación detectada</span><table class="liq-table">${d.liquidacion.map(r=>`<tr><td>${escapeHtml(r.rubro||'')}</td><td>${escapeHtml(r.monto||'')}</td></tr>`).join('')}</table></div>` : ''}
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button class="btn btn-brass btn-small" onclick="confirmarDocumentoPrincipal()">Agregar como documento principal</button>
      <button class="btn btn-ghost btn-small" onclick="tratarComoNovedadSimple()">Tratar como novedad simple</button>
    </div>
  `;
}

async function confirmarDocumentoPrincipal(){
  const route = currentRoute();
  if(route.view !== 'detail' || !pendingDocPrincipal) return;
  const p = pericias.find(x => x.id === route.id);
  if(!p.documentos) p.documentos = [];
  p.documentos.push({ id: uid(), ...pendingDocPrincipal });
  const tipoGuardado = pendingDocPrincipal.tipo_documento;
  pendingDocPrincipal = null;
  document.getElementById('detail-ai-texto').value = '';
  document.getElementById('detail-ai-archivo').value = '';
  document.getElementById('detail-ai-status').textContent = '';
  renderRoute();
  await persist(`Agrega ${tipoGuardado} en expte. ${p.expediente || p.id}`);
}

/* ---------- Búsqueda con IA dentro de un juicio ---------- */
function armarBloquesBusqueda(p){
  const bloques = [];
  const textoHeader = [
    p.resumen || '',
    ...(p.datos_clave || []).map(d => `${d.label}: ${d.valor}`)
  ].filter(Boolean).join(' — ');
  bloques.push({ id: 'header', texto: `Ficha del expediente (designación, estado, datos generales). ${textoHeader}` });

  (p.documentos || []).forEach(doc => {
    const textoDoc = [
      doc.resumen || '',
      ...(doc.datos_clave || []).map(d => `${d.label}: ${d.valor}`),
      ...(doc.puntos_periciales || []),
      doc.postura_pericial || ''
    ].filter(Boolean).join(' — ');
    bloques.push({ id: 'doc-' + doc.id, texto: `${doc.tipo_documento || 'Documento'} (${fmtDate(doc.fecha)}). ${textoDoc}` });
  });

  (p.novedades || []).forEach(n => {
    bloques.push({ id: 'nov-' + n.id, texto: `Novedad del ${fmtDate(n.fecha)}. ${n.texto}` });
  });

  return bloques;
}

function irABloque(id){
  const el = document.getElementById('bloque-' + id);
  if(!el) return false;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.remove('resaltado');
  void el.offsetWidth; // reinicia la animación si ya se había resaltado antes
  el.classList.add('resaltado');
  return true;
}

async function ejecutarBusqueda(){
  const route = currentRoute();
  if(route.view !== 'detail') return;
  const p = pericias.find(x => x.id === route.id);
  const query = document.getElementById('buscar-input').value.trim();
  const statusDiv = document.getElementById('buscar-status');
  statusDiv.style.color = 'var(--slate)';

  if(!query){ statusDiv.textContent = 'Escribí qué estás buscando.'; return; }
  if(!config || !config.workerUrl || !config.workerKey){
    statusDiv.textContent = 'Todavía no configuraste el Worker de IA — sin eso, la búsqueda no funciona.';
    return;
  }

  const bloques = armarBloquesBusqueda(p);
  statusDiv.textContent = 'Buscando…';
  try{
    const res = await fetch(config.workerUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-App-Key': config.workerKey },
      body: JSON.stringify({ tipo: 'buscar', query, bloques })
    });
    const data = await res.json();
    if(!res.ok || !data.result || !data.result.mejor_id){
      statusDiv.style.color = 'var(--alert)';
      statusDiv.textContent = 'No se pudo buscar (' + (data.error || res.status) + ').';
      return;
    }
    const encontrado = irABloque(data.result.mejor_id);
    if(encontrado){
      statusDiv.style.color = 'var(--ok)';
      statusDiv.textContent = '✓ Encontrado.';
    } else {
      statusDiv.style.color = 'var(--alert)';
      statusDiv.textContent = 'La IA no encontró una coincidencia clara para esa búsqueda.';
    }
  }catch(e){
    statusDiv.style.color = 'var(--alert)';
    statusDiv.textContent = 'Error de conexión con el Worker.';
  }
}

async function saveForm(){
  const id = document.getElementById('f-id').value;
  const expediente = document.getElementById('f-expediente').value.trim();
  const contador = document.getElementById('f-contador').value.trim();
  const caratula = document.getElementById('f-caratula').value.trim();
  const juzgado = getJuzgadoValue();
  const resumen = document.getElementById('f-resumen').value.trim();
  let datosClave = [];
  try{ datosClave = JSON.parse(document.getElementById('f-datos-clave').value || '[]'); }catch(e){ datosClave = []; }
  let puntosPericiales = [];
  try{ puntosPericiales = JSON.parse(document.getElementById('f-puntos-periciales').value || '[]'); }catch(e){ puntosPericiales = []; }
  const puntosPericialesModo = document.getElementById('f-puntos-periciales-modo').value === 'separado' ? 'separado' : 'conjunto';
  let puntosPericialesPartes = [];
  try{ puntosPericialesPartes = JSON.parse(document.getElementById('f-puntos-periciales-partes').value || '[]'); }catch(e){ puntosPericialesPartes = []; }
  const posturaPericial = document.getElementById('f-postura-pericial').value.trim();
  let liquidacion = [];
  try{ liquidacion = JSON.parse(document.getElementById('f-liquidacion').value || '[]'); }catch(e){ liquidacion = []; }
  const estado = document.getElementById('f-estado').value;
  const vencimiento = document.getElementById('f-vencimiento').value;
  if(!expediente && !caratula){ alert('Cargá al menos el número de expediente o la carátula.'); return; }

  let message;
  if(id){
    const p = pericias.find(x => x.id === id);
    Object.assign(p, { expediente, contador, caratula, juzgado, resumen, datos_clave: datosClave, puntos_periciales: puntosPericiales, puntos_periciales_modo: puntosPericialesModo, puntos_periciales_partes: puntosPericialesPartes, postura_pericial: posturaPericial, liquidacion, estado, vencimiento });
    message = `Actualiza pericia expte. ${expediente || id}`;
  } else {
    pericias.push({ id: uid(), expediente, contador, caratula, juzgado, resumen, datos_clave: datosClave, puntos_periciales: puntosPericiales, puntos_periciales_modo: puntosPericialesModo, puntos_periciales_partes: puntosPericialesPartes, postura_pericial: posturaPericial, liquidacion, estado, vencimiento, fecha_designacion: new Date().toISOString().slice(0,10), novedades: [], documentos: [] });
    message = `Nueva pericia expte. ${expediente || 's/n°'}`;
  }
  renderAll();
  closeForm();
  await persist(message);
}

function openPinPrompt(){
  document.getElementById('cfg-pin').value = '';
  document.getElementById('pin-error').style.display = 'none';

async function submitPin(){
  const pin = document.getElementById('cfg-pin').value;
  const errorDiv = document.getElementById('pin-error');
  errorDiv.style.display = 'none';
  if(!pin){ return; }
  document.getElementById('btn-entrar-pin').disabled = true;
  try{
    setLoginStatus('Verificando PIN…');
    const blob = await fetchEncryptedConfig();
    const decoded = await decryptConfig(pin, blob); // {owner, repo, branch, token}
    if(decoded.workerUrl){
      decoded.workerUrl = decoded.workerUrl.trim();
      if(decoded.workerUrl && !/^https?:\/\//i.test(decoded.workerUrl)){
        decoded.workerUrl = 'https://' + decoded.workerUrl;
      }
      decoded.workerUrl = decoded.workerUrl.replace(/\/+$/, ''); // sin barra final
    }
    const dataKey = await deriveDataKey(pin, b64ToBytes(blob.salt), blob.iterations);
    decoded.dataKey = dataKey;
    saveSessionConfig(decoded);
    await connectAndLoad();
  }catch(e){
    errorDiv.textContent = 'PIN incorrecto. Probá de nuevo.';
    errorDiv.style.display = 'block';
    setLoginStatus('');
  }
  document.getElementById('btn-entrar-pin').disabled = false;
}

  clearSession();
  pericias = [];
  hideApp();
  openPinPrompt();
}

document.getElementById('btn-buscar-ir').addEventListener('click', ejecutarBusqueda);
document.getElementById('buscar-input').addEventListener('keydown', (e) => { if(e.key === 'Enter') ejecutarBusqueda(); });
document.getElementById('btn-detail-agregar').addEventListener('click', addNovedadDetail);
document.getElementById('btn-ai-analizar').addEventListener('click', analizarConIA);
document.getElementById('btn-detail-ai-analizar').addEventListener('click', analizarNovedadConIA);
poblarSelectJuzgado();
document.getElementById('f-juzgado').addEventListener('change', () => {
  const sel = document.getElementById('f-juzgado');
  const otro = document.getElementById('f-juzgado-otro');
  if(sel.value === '__otro__'){
    otro.classList.remove('hidden');
    otro.focus();
  } else {
    otro.classList.add('hidden');
    otro.value = '';
  }
});
window.addEventListener('hashchange', renderRoute);

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker no registrado:', err));
  });
}

(async function init(){
  loadSessionConfig();
  await connectAndLoad();
})();
</script>
</body>
</html>
